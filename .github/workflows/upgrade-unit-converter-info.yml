name: Upgrade Unit Converter Info

on:
  push:
    paths:
      - '.github/workflows/upgrade-unit-converter-info.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade Info / Donations
        run: python .github/scripts/upgrade-unit-converter-info.py
      - name: Verify
        run: |
          grep -q 'info-payment-options' index.html
          grep -q 'Donate with PayPal' index.html
          grep -q 'Donate with Stripe' index.html
          grep -q 'paymentAvailability' index.html
          grep -q 'Roman' index.html
          ! grep -q 'apps-games-info-standard.js' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade Unit Converter Info design"
          git push
